[project]
name = "amr-genomeguard"
version = "0.1.0"
description = "MLOps-enabled antibiotic resistance phenotype prediction from bacterial genome data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "joblib>=1.3",
]

[project.scripts]
amr-guard = "amr_guard.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amr_guard"]
